<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json?v=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css?v=2.2" />
    <link rel="icon" href="images/favicon.png?v=1.0" type="image/x-icon" />
    <title>Viajes Diarios</title>
  </head>
  <body>
    <main>
      <div class="main-container">
        <div class="main-action-container">
          <h1>Control de Viajes</h1>
          <div class="goal-container">
            <ul class="goal-advance-container">
              <li class="goal-advance">10</li>
              <li class="goal-advance">20</li>
              <li class="goal-advance">30</li>
              <li class="goal-advance">40</li>
              <li class="goal-advance">50</li>
              <li class="goal-advance">60</li>
              <li class="goal-advance">70</li>
              <li class="goal-advance">80</li>
              <li class="goal-advance">90</li>
              <li class="goal-advance">100</li>
            </ul>
          </div>
          <p class="total-label" id="total-label">
            $ <span id="trips-total" data-last-value="">0</span>
          </p>
          <div class="trips-buttons-container">
            <button class="trip-button" value="10">$10</button>
            <button class="trip-button" value="15">$15</button>
            <button class="trip-button" value="20">$20</button>
            <button class="other-trip-button" id="other-cost-btn" value="0">
              Otro
            </button>
          </div>
          <div class="menu" id="menu">
            <!-- <button class="test-json" id="test-json">Menu</button> -->
            <button class="history-btn" id="history-btn">📆</button>
            <button class="reverse-button" id="reverse-button">↩</button>
          </div>
        </div>
      </div>
      <div class="diferent-trip-container" id="diferent-trip-container">
        <form action="./" method="get" class="diferent-trip-form">
          <input type="number" placeholder="$--" id="diferent-trip-value" />
          <input type="submit" value="Aceptar" />
          <input type="button" value="Cancelar" id="cancel-trip-btn" />
        </form>
        <div id="error-container" class="error-container">
          <p id="error-message">Error no ingresaste un valor</p>
        </div>
      </div>
      <div id="history-container" class="history-container">
        <div class="history-header">
          <button class="control-btn" id="prev-date-btn"><-</button>
          <h2 id="history-date" data-date="hoy">Hoy</h2>
          <button class="control-btn" id="next-date-btn">-></button>
        </div>
        <div class="history-body">
          <div class="card">
            <div class="title" id="title"><span id="history-title"></span></div>
            <div class="subtitle" id="subtitle"></div>
            <canvas
              id="pie"
              width="480"
              height="420"
              aria-label="Gráfica circular con diez valores"
            ></canvas>
          </div>

          <div id="tooltip" class="tooltip" style="display: none"></div>
          <button class="close-btn" id="close-btn">X</button>
        </div>
      </div>
      <div id="app-loader" class="loader hidden">
        <div class="spinner"></div>
      </div>
    </main>
    <script src="script.js?v=2.2" type="module"></script>
  </body>
</html>
